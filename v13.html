<script>
    (function () {
      var OFF = "rounded-full flex items-center justify-center font-bold bg-surface-container-lowest text-on-surface border border-on-surface/30";
      var rejilla = document.getElementById("loto-grid");
      for (var n = 1; n <= 49; n++) {
        var b = document.createElement("button");
        b.type = "button";
        b.className = OFF;
        b.dataset.n = String(n);
        b.textContent = (n < 10 ? "0" : "") + n;
        b.setAttribute("aria-pressed", "false");
        rejilla.appendChild(b);
      }
      var nums = Array.prototype.slice.call(rejilla.querySelectorAll("button"));
      function marcados() {
        return nums.filter(function (b) { return b.getAttribute("aria-pressed") === "true"; }).map(function (b) { return +b.dataset.n; });
      }
      function pintar(b, on) {
        b.setAttribute("aria-pressed", on ? "true" : "false");
        b.classList.toggle("on", !!on);
      }
      function baseKpi() {
        var n = marcados().length;
        document.getElementById("kpi-base").textContent = String(n);
        document.getElementById("counter-badge").textContent = String(n);
      }
      nums.forEach(function (b) {
        b.addEventListener("click", function () {
          pintar(b, b.getAttribute("aria-pressed") !== "true");
          baseKpi();
        });
      });
      function aviso(titulo, texto) {
        document.getElementById("ahora").textContent = titulo;
        document.getElementById("linea").textContent = texto;
      }
      document.getElementById("azar").addEventListener("click", function () {
        var n = parseInt(String(document.getElementById("base").value).trim(), 10);
        if (!(n >= 1 && n <= 49)) { aviso("Error", "La base va de 1 a 49."); return; }
        var elegidos = {};
        while (Object.keys(elegidos).length < n) elegidos[1 + Math.floor(Math.random() * 49)] = 1;
        nums.forEach(function (b) { pintar(b, !!elegidos[+b.dataset.n]); });
        baseKpi();
        aviso("Listo", n + " números.");
      });
      document.getElementById("vaciar").addEventListener("click", function () {
        nums.forEach(function (b) { pintar(b, false); });
        baseKpi();
        aviso("Listo", "Ningún número.");
      });
      document.getElementById("azar-premio").addEventListener("click", function () {
        var k = parseInt(document.getElementById("k").value, 10);
        var origen = marcados();
        if (!origen.length) { origen = []; for (var i = 1; i <= 49; i++) origen.push(i); }
        if (!(k >= 1) || k > origen.length) { aviso("Error", "k es mayor que los números disponibles."); return; }
        var copia = origen.slice();
        for (var j = copia.length - 1; j > 0; j--) {
          var s = Math.floor(Math.random() * (j + 1));
          var tmp = copia[j]; copia[j] = copia[s]; copia[s] = tmp;
        }
        document.getElementById("premio").value = copia.slice(0, k).sort(function (a, c) { return a - c; }).map(function (x) { return (x < 10 ? "0" : "") + x; }).join(" ");
      });
      var ciclos = document.getElementById("ciclos");
      ciclos.addEventListener("click", function () {
        var on = ciclos.getAttribute("aria-checked") !== "true";
        ciclos.setAttribute("aria-checked", on ? "true" : "false");
        ciclos.classList.toggle("justify-end", on);
      });
      function pintarModo() {
        document.querySelectorAll(".modo").forEach(function (el) {
          el.classList.toggle("modo-on", el.querySelector("input[type=radio]").checked);
        });
      }
      document.querySelectorAll(".modo").forEach(function (el) {
        el.addEventListener("click", function () {
          el.querySelector("input[type=radio]").checked = true;
          pintarModo();
        });
      });
      var tema = document.getElementById("tema");
      function aplicarTema(nombre) {
        var oscuro = nombre === "oscuro";
        document.documentElement.dataset.tema = nombre;
        document.documentElement.classList.toggle("dark", oscuro);
        document.documentElement.classList.toggle("light", !oscuro);
        tema.setAttribute("aria-checked", oscuro ? "true" : "false");
      }
      aplicarTema(document.documentElement.dataset.tema || "claro");
      tema.addEventListener("click", function () {
        var siguiente = document.documentElement.dataset.tema === "oscuro" ? "claro" : "oscuro";
        try { localStorage.setItem("loto-tema", siguiente); } catch (e) {}
        aplicarTema(siguiente);
      });
      document.getElementById("panel-filtros").addEventListener("click", function () {
        document.getElementById("content-filtros").classList.toggle("hidden");
      });
      function val(id) { return document.getElementById(id).value; }
      function leer() {
        var filtros = {};
        ["suma", "pares", "bajos", "dist", "seguidos", "decenas", "term"].forEach(function (c) {
          filtros[c] = document.getElementById("f-" + c).checked;
        });
        ["suma0", "suma1", "pares0", "pares1", "bajos0", "bajos1", "dist0", "dist1", "seguidos0", "decenas0", "term0"].forEach(function (c) {
          filtros[c] = val(c);
        });
        var modo = "n";
        document.querySelectorAll("input[name=modo]").forEach(function (r) { if (r.checked) modo = r.value; });
        return {
          base: val("base"), k: val("k"), tipo: val("tipo"),
          ciclos: ciclos.getAttribute("aria-checked") === "true",
          modo: modo, cantidad: val("cantidad"), porc: val("porc"),
          marcados: marcados(), grupos: val("grupos"), incluir: val("incluir"),
          filtros: filtros, premio: val("premio")
        };
      }
      function ocupado(si) {
        document.getElementById("calcular").disabled = si;
        document.getElementById("parar").disabled = !si;
        document.getElementById("pulso").classList.toggle("animate-pulse", si);
      }
      function pintarEstado(e) {
        if (!e) return;
        document.getElementById("ahora").textContent = e.ahora || "Listo";
        document.getElementById("linea").textContent = e.linea || "";
        document.getElementById("actividad").textContent = (e.log || []).join("\n");
        document.getElementById("kpi-apuestas").textContent = String(e.apuestas != null ? e.apuestas : 0);
        if (e.cobertura) document.getElementById("kpi-cob").textContent = e.cobertura;
        ocupado(!!e.ocupado);
        var caja = document.getElementById("actividad");
        caja.scrollTop = caja.scrollHeight;
      }
      function sinPrograma() {
        aviso("Programa", "El cálculo corre al abrir LottoOptimizerV3_13.");
      }
      async function llamar(nombre) {
        if (!window.pywebview || !window.pywebview.api) { sinPrograma(); return; }
        var r = await window.pywebview.api[nombre](leer());
        if (r && r.ok === false && r.error) aviso("Error", r.error);
      }
      document.getElementById("calcular").addEventListener("click", function () { llamar("calcular"); });
      document.getElementById("parar").addEventListener("click", function () { llamar("parar"); });
      document.getElementById("revisar-botones").addEventListener("click", function (ev) {
        var btn = ev.target.closest("button");
        if (!btn) return;
        llamar(btn.getAttribute("data-accion"));
      });
      window.addEventListener("pywebviewready", function () {
        setInterval(async function () {
          try { pintarEstado(await window.pywebview.api.estado()); } catch (e) {}
        }, 200);
      });
    })();
  </script>
</body></html>
